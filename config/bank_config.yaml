      high_net_worth:  { clv_multiplier: 3.2, nba_depth: 4 }
      ultra_hnw:       { clv_multiplier: 5.0, nba_depth: 4 }

# ─── Global ─────────────────────────────────────────────────────────
global:
  llm_model: "claude-sonnet-4-6"
  agent_timeout_seconds: 30
  max_parallel_agents: 4
  cache_ttl_seconds: 300
  log_level: "INFO"
  enable_agent_tracing: true
  enable_cross_agent_calls: true
