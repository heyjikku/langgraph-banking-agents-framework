      high_net_worth: [mutual_fund_sip, home_loan, insurance]
      ultra_hnw:      [mutual_fund_sip, home_loan, msme_loan]
    product_revenue_annual:
      savings_account: 1200
      home_loan: 38000
      gold_loan: 9500
      msme_loan: 42000
      personal_loan: 11000
      mutual_fund_sip: 6500
      insurance: 4800
    segments:
      mass_retail:     { clv_multiplier: 1.0, nba_depth: 3 }
      mass_affluent:   { clv_multiplier: 1.8, nba_depth: 4 }
