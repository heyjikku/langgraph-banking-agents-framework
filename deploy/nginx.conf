events { worker_connections 1024; }
http {
  upstream agents { server banking-agents:8000; }
  server {
    listen 80;
    client_max_body_size 4m;
    location / { proxy_pass http://agents; proxy_set_header Host $host; }
    location /health { proxy_pass http://agents/health; }
    location /docs   { proxy_pass http://agents/docs; }
    location /openapi.json { proxy_pass http://agents/openapi.json; }
    location /api/ {
      proxy_pass http://agents;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 60s;
    }
  }
}
